receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: pipeline.hop
        value: otel-collector
        action: upsert
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed
  otlphttp/sink:
    metrics_endpoint: http://sink:8000/v1/metrics
    encoding: json

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/sink]
